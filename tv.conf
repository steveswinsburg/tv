# TV dashboard - 240 columns × 67 rows
# Every panel runs on a loop, so that a missing command or session won't close the entire dashboard
# Change the command inside each panel to customise it.

set-environment -g TZ Australia/Sydney

set -g default-shell /bin/bash
set -g default-terminal screen
set -g base-index 0
setw -g pane-base-index 0
setw -g remain-on-exit on
set -g history-limit 10000

# Appearance
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=green"
set -g pane-active-border-style "fg=green"
set -g status-style "bg=black,fg=green"
set -g status-left-length 40
set -g status-left " TV | #H "
set -g status-right " %Y-%m-%d  %H:%M "
set -g status-interval 5

# MAIN: view a normal tmux session called "agent"
# Change "agent" in all places if you use another session name.
# No session? Display a message and retry every five seconds.
new-session -d -s tv -n dashboard -x 240 -y 67 'while :; do clear; printf "\n  Waiting for tmux session: agent\n\n  Start it over SSH with: tmux new -s agent\n"; if tmux -L default has-session -t =agent 2>/dev/null; then env -u TMUX tmux -L default attach-session -f read-only -t =agent; fi; sleep 5; done'
select-pane -T "AGENT"

# RIGHT COLUMN: compact CPU, memory and storage panels.
# These come from tv-panel as /usr/local/bin/tv-panel (see README).
split-window -h -l 35% -t 'tv:dashboard.{top-left}' 'while :; do /usr/local/bin/tv-panel cpu; printf "\nCPU panel stopped; retrying in 5 seconds...\n"; sleep 5; done'
select-pane -T "CPU"

split-window -v -l 66% -t 'tv:dashboard.{top-right}' 'while :; do /usr/local/bin/tv-panel memory; printf "\nMemory panel stopped; retrying in 5 seconds...\n"; sleep 5; done'
select-pane -T "MEMORY"

# The newly created pane is still selected; split it to keep memory above storage.
split-window -v -l 50% 'while :; do /usr/local/bin/tv-panel storage; printf "\nStorage panel stopped; retrying in 5 seconds...\n"; sleep 5; done'
select-pane -T "STORAGE"

# BOTTOM LEFT: recent system warnings.
split-window -v -l 25% -t 'tv:dashboard.{top-left}' 'while :; do clear; printf "RECENT SYSTEM WARNINGS\n\n"; journalctl -b -p warning -n 8 --no-pager -o short 2>/dev/null || printf "Journal unavailable for this user\n"; sleep 15; done'
select-pane -T "SYSTEM WARNINGS"

# BOTTOM MIDDLE: compact uptime and one IP address per line.
split-window -h -l 50% -t 'tv:dashboard.{bottom-left}' 'while :; do /usr/local/bin/tv-panel network; printf "\nNetwork panel stopped; retrying in 5 seconds...\n"; sleep 5; done'
select-pane -T "NETWORK / UPTIME"

# OPTIONAL PANELS: uncomment a split-window AND its select-pane line to enable.
# Each adds a pane below the agent; enable only the ones you want.
# Change service names, container filters and log paths for your server.

